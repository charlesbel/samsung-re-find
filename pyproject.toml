[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "samsung-find"
version = "0.2.0"
description = "Persistent Samsung Find SDK, JSON CLI, and MCP server for Samsung SmartThings Find"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Charles Bel"},
  {name = "Hermes Agent"},
]
keywords = ["samsung", "smartthings-find", "device-location", "sdk", "cli", "mcp", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=42",
  "httpx>=0.27",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
mcp = [
  "mcp>=1.0.0",
]
dev = [
  "build>=1.2",
  "jsonschema>=4.20",
  "mcp>=1.0.0",
  "pytest>=8",
  "respx>=0.21",
  "ruff>=0.6",
  "twine>=5.0",
]

[project.scripts]
samsung-find = "samsung_find.cli:main"
samsung-find-mcp = "samsung_find.mcp_server:main"

[project.urls]
Homepage = "https://github.com/charlesbel/samsung-find"
Repository = "https://github.com/charlesbel/samsung-find"
Issues = "https://github.com/charlesbel/samsung-find/issues"
Documentation = "https://github.com/charlesbel/samsung-find#readme"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"samsung_find" = ["py.typed"]
