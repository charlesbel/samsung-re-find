name: Security Scan

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.12"
      - name: Install project and security scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev,mcp]'
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - name: Scan tracked tree and complete Git history
        run: |
          "$(go env GOPATH)/bin/gitleaks" dir --config .gitleaks.toml --redact --no-banner --exit-code 1 .
          "$(go env GOPATH)/bin/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
      - name: Audit Python dependency vulnerabilities
        run: pip-audit --strict
      - name: Build and scan extracted archive contents
        run: |
          rm -rf dist build
          python -m build
          mkdir -p /tmp/samsung-re-find-archives/sdist /tmp/samsung-re-find-archives/wheel
          python -c "import glob,tarfile,zipfile; tarfile.open(glob.glob('dist/*.tar.gz')[0]).extractall('/tmp/samsung-re-find-archives/sdist', filter='data'); zipfile.ZipFile(glob.glob('dist/*.whl')[0]).extractall('/tmp/samsung-re-find-archives/wheel')"
          "$(go env GOPATH)/bin/gitleaks" dir --config .gitleaks.toml --redact --no-banner --exit-code 1 /tmp/samsung-re-find-archives
