name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev,mcp]'
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,mcp]'
      - run: python -m pytest

  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Verify package archives
        run: |
          python -c "
          import tarfile, zipfile, glob, sys
          sdists = glob.glob('dist/*.tar.gz')
          wheels = glob.glob('dist/*.whl')
          assert len(sdists) == 1, 'Expected exactly 1 sdist'
          assert len(wheels) == 1, 'Expected exactly 1 wheel'

          with tarfile.open(sdists[0], 'r:gz') as tar:
              names = tar.getnames()
              assert any('LICENSE' in n for n in names), 'LICENSE missing in sdist'
              assert any('py.typed' in n for n in names), 'py.typed missing in sdist'
              assert any('.skills' in n for n in names), '.skills missing in sdist'
              assert not any('.env' in n for n in names), 'Secrets found in sdist'

          with zipfile.ZipFile(wheels[0], 'r') as whl:
              w_names = whl.namelist()
              assert any('py.typed' in n for n in w_names), 'py.typed missing in wheel'
              assert not any('.env' in n for n in w_names), 'Secrets found in wheel'
          print('Package verification passed.')
          "
