name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable release tag to build"
        required: true
        type: string
      publish_to_pypi:
        description: "Publish verified distributions to PyPI"
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  verify-and-build:
    name: Verify Release Gates & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate tag matches project version
        run: |
          RELEASE_TAG="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag '$RELEASE_TAG' is not an exact numeric SemVer tag" >&2
            exit 1
          }
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)" || {
            echo "Release tag '$RELEASE_TAG' does not point to the checked-out commit" >&2
            exit 1
          }
          TAG_VERSION="$RELEASE_TAG"
          PROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$TAG_VERSION" = "$PROJECT_VERSION" || {
            echo "Tag version '$TAG_VERSION' does not match project version '$PROJECT_VERSION'" >&2
            exit 1
          }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          python -m pip install -e '.[dev,mcp]'
      - name: Code quality and lint
        run: |
          ruff check .
          ruff format --check .
      - name: Run test suite (standard and optimized)
        run: |
          python -m pytest
          python -O -m pytest
      - name: Audit dependency security
        run: |
          uv export --frozen --no-dev --extra mcp --no-emit-project --output-file /tmp/audit-requirements.txt
          pip-audit --strict --requirement /tmp/audit-requirements.txt
      - name: Scan full Git history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          "$(go env GOPATH)/bin/gitleaks" git --config .gitleaks.toml --verbose --redact
      - name: Build package distributions
        run: python -m build
      - name: Validate distribution metadata
        run: twine check --strict dist/*
      - name: Verify package archives
        run: |
          python -c "
          import tarfile, zipfile, glob, sys
          sdists = glob.glob('dist/*.tar.gz')
          wheels = glob.glob('dist/*.whl')
          assert len(sdists) == 1, 'Expected exactly 1 sdist'
          assert len(wheels) == 1, 'Expected exactly 1 wheel'

          with tarfile.open(sdists[0], 'r:gz') as tar:
              names = tar.getnames()
              assert any('LICENSE' in n for n in names), 'LICENSE missing in sdist'
              assert any('py.typed' in n for n in names), 'py.typed missing in sdist'
              assert any('.skills' in n for n in names), '.skills missing in sdist'
              assert not any('.env' in n for n in names), 'Secrets found in sdist'

          with zipfile.ZipFile(wheels[0], 'r') as whl:
              w_names = whl.namelist()
              assert any('py.typed' in n for n in w_names), 'py.typed missing in wheel'
              assert any('schemas' in n for n in w_names), 'schemas missing in wheel'
              assert not any('.env' in n for n in w_names), 'Secrets found in wheel'
          print('Release archive verification passed.')
          "
      - name: Smoke test built wheel with MCP in isolated venv
        run: |
          WHEEL=$(ls dist/*.whl)
          python -m venv .smoke-venv
          .smoke-venv/bin/pip install --upgrade pip
          .smoke-venv/bin/pip install "${WHEEL}[mcp]"
          .smoke-venv/bin/python scripts/smoke_built_wheel.py
      - name: Upload dist artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: [verify-and-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.publish_to_pypi == true
    environment:
      name: pypi
      url: https://pypi.org/p/samsung-re-find
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806  # v4.1.9
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  github-release:
    name: GitHub Release
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.publish_to_pypi == true
    permissions:
      contents: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806  # v4.1.9
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191  # v2.0.8
        with:
          files: dist/*
          generate_release_notes: true
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
